apiVersion: v1
kind: ServiceAccount
metadata:
  name: vk-host-sa
  namespace: vibe-kanban
  labels:
    app.kubernetes.io/component: host
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vk-host-opencode-config
  namespace: vibe-kanban
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "provider": {
        "minimax": {
          "apiKey": "env:MINIMAX_API_KEY"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-host
  namespace: vibe-kanban
  labels:
    app: vk-host
    app.kubernetes.io/component: host
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vk-host
  template:
    metadata:
      labels:
        app: vk-host
    spec:
      serviceAccountName: vk-host-sa
      nodeSelector:
        kubernetes.io/hostname: woowtechcluster1-aorus-15p-xd
      initContainers:
        - name: install-opencode
          image: ubuntu:24.04
          command:
            - bash
            - -c
            - |
              DEST="/workspace/.bin"
              mkdir -p "$DEST"
              chown 10001:10001 "$DEST"
              if [ -f "$DEST/opencode" ] && "$DEST/opencode" --version 2>&1 | grep -q "^[0-9]"; then
                echo "OpenCode already installed: $($DEST/opencode --version 2>&1)"
              else
                apt-get update && apt-get install -y --no-install-recommends curl ca-certificates npm && rm -rf /var/lib/apt/lists/*
                rm -f "$DEST/opencode"
                curl -fsSL https://opencode.ai/install | HOME=/tmp bash -s -- --no-modify-path
                cp /tmp/.opencode/bin/opencode "$DEST/opencode"
                chmod +x "$DEST/opencode"
                chown 10001:10001 "$DEST/opencode"
                echo "OpenCode installed: $($DEST/opencode --version 2>&1)"
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        - name: wait-for-relay
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for relay server..."
              until wget --spider -q http://vk-relay-svc:8082/health 2>/dev/null; do
                echo "  relay not ready, retrying in 3s..."
                sleep 3
              done
              echo "Relay is ready!"
      containers:
        - name: host
          image: localhost/vk-host:v0.1.43
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: RUST_LOG
              value: "info"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: VK_SHARED_API_BASE
              value: "https://woowtechkxs-vibekanban.woowtech.io"
            - name: VK_SHARED_RELAY_API_BASE
              value: "https://woowtechkxs-vibekanban-relay.woowtech.io"
            - name: PATH
              value: "/var/tmp/vibe-kanban/.bin:/home/appuser/.opencode/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: MINIMAX_API_KEY
          volumeMounts:
            - name: workspace
              mountPath: /var/tmp/vibe-kanban
            - name: opencode-config
              mountPath: /home/appuser/.opencode.json
              subPath: opencode.json
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: vk-host-workspace-pvc
        - name: opencode-config
          configMap:
            name: vk-host-opencode-config
---
apiVersion: v1
kind: Service
metadata:
  name: vk-host-svc
  namespace: vibe-kanban
  labels:
    app: vk-host
spec:
  selector:
    app: vk-host
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP

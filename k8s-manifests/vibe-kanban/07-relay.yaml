apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-relay
  namespace: vibe-kanban
  labels:
    app: vk-relay
    app.kubernetes.io/component: relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vk-relay
  template:
    metadata:
      labels:
        app: vk-relay
    spec:
      nodeSelector:
        kubernetes.io/hostname: woowtechcluster1-aorus-15p-xd
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z vk-db-svc 5432; do
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: relay
          image: localhost/vk-relay:v0.1.43
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: RUST_LOG
              value: "info,relay=info"
            - name: RELAY_LISTEN_ADDR
              value: "0.0.0.0:8082"
            - name: SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: SERVER_DATABASE_URL
            - name: VIBEKANBAN_REMOTE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vk-secrets
                  key: VIBEKANBAN_REMOTE_JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vk-relay-svc
  namespace: vibe-kanban
  labels:
    app: vk-relay
spec:
  selector:
    app: vk-relay
  ports:
    - name: http
      protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP

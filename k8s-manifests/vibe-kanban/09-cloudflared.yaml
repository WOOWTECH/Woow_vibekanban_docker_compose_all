apiVersion: v1
kind: Secret
metadata:
  name: vk-cf-tunnel-secret
  namespace: vibe-kanban
  labels:
    app.kubernetes.io/part-of: vibe-kanban
type: Opaque
stringData:
  TUNNEL_TOKEN: "eyJhIjoiOWMyN2Y2MjNlZTU5NmUwYjY3YmU1NjI2M2JjYjE5NzQiLCJ0IjoiMjY4MDdiYTUtYTBiZi00MDliLTgwOGEtMmQ2Mzc4ZTUwZDYwIiwicyI6Imk0K0NsTVJDN3R1WGdqb3FxeGFWMlVDazJwdUI5aTB4bmtHUEtPaDNHeHM9In0="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-cloudflared
  namespace: vibe-kanban
  labels:
    app: vk-cloudflared
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vk-cloudflared
  template:
    metadata:
      labels:
        app: vk-cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vk-cf-tunnel-secret
                  key: TUNNEL_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always

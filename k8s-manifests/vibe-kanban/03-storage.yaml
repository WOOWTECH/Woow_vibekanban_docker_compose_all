apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vk-db-pvc
  namespace: vibe-kanban
  labels:
    app: vk-db
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vk-electric-pvc
  namespace: vibe-kanban
  labels:
    app: vk-electric
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vk-host-workspace-pvc
  namespace: vibe-kanban
  labels:
    app: vk-host
spec:
  storageClassName: nfs-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
